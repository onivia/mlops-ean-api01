name: Test Azure Connection

on:
  workflow_dispatch:

jobs:
  test-azure:
    runs-on: ubuntu-latest
    steps:
      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verificar conexión
        run: az group show --name rg-mlops-ean --query "{Nombre:name,Estado:properties.provisioningState}" -o table
